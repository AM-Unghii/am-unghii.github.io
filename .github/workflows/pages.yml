name: Publică versiunea web (PWA)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Repo numit <cont>.github.io = site la rădăcină (fără /<repo>/ în adresă)
      - name: Build web
        env:
          REPO: ${{ github.event.repository.name }}
          EXPO_PUBLIC_COMMIT: ${{ github.sha }}
        run: |
          case "$REPO" in
            *.github.io) export EXPO_BASE_URL= ;;
            *) export EXPO_BASE_URL="/$REPO" ;;
          esac
          npx expo export --platform web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
